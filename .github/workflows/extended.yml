name: Extended engineering gates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    name: Extended gates
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the exact protected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,llvm-tools-preview,rust-src,rustfmt --target aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-unknown-linux-gnu

      - name: Install PR and extended detector tools
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          cargo install --locked --version 0.9.138 cargo-nextest
          cargo install --locked --version 0.19.9 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.9.2 cargo-machete
          cargo install --locked --version 0.10.2 cargo-vet
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version | grep --fixed-strings --line-regexp "$GITLEAKS_VERSION"

      - name: Run the authoritative extended gate runner
        run: cargo xtask quality --profile ext

      - name: Retain the exact gate attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/quality/evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
