name: Engineering quality

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PR gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,llvm-tools-preview,rust-src,rustfmt --target aarch64-apple-darwin,aarch64-unknown-linux-gnu,x86_64-apple-darwin,x86_64-unknown-linux-gnu

      - name: Install pinned branch-coverage toolchain
        run: rustup toolchain install nightly-2026-07-20 --profile minimal --component llvm-tools-preview

      - name: Install cargo-nextest
        run: cargo install --locked --version 0.9.138 cargo-nextest

      - name: Install cargo-llvm-cov
        run: cargo install --locked --version 0.8.7 cargo-llvm-cov

      - name: Install cargo-deny
        run: cargo install --locked --version 0.19.9 cargo-deny

      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Install cargo-machete
        run: cargo install --locked --version 0.9.2 cargo-machete

      - name: Install cargo-vet
        run: cargo install --locked --version 0.10.2 cargo-vet

      - name: Install cargo-mutants
        run: cargo install --locked --version 27.1.0 cargo-mutants

      - name: Install Gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version | grep --fixed-strings --line-regexp "$GITLEAKS_VERSION"

      - name: Run the authoritative PR gate runner
        run: cargo xtask quality --profile pr

      - name: Retain the exact gate attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: target/quality/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
