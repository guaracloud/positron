[package]
name = "positron-query"
description = "Positron native bounded query execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
positron-domain = { path = "../positron-domain" }
positron-governance = { path = "../positron-governance" }
positron-kernel = { path = "../positron-kernel" }
positron-signals = { path = "../positron-signals" }
regex-automata = { version = "=0.4.18", default-features = false, features = [
    "dfa-build",
    "dfa-search",
    "std",
    "syntax",
    "unicode",
] }
regex-syntax = "=0.8.11"

[dev-dependencies]
positron-kernel = { path = "../positron-kernel", features = ["test-support"] }
positron-policy = { path = "../positron-policy" }
positron-runtime = { path = "../positron-runtime", features = ["test-support"] }
