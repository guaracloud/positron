[package]
name = "positron-kernel"
description = "Positron storage-kernel scaffold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
positron-domain = { path = "../positron-domain" }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
positron-darwin-acl = { path = "../positron-darwin-acl" }

[[test]]
name = "primary_data_volume_process"
path = "tests/primary_data_volume_process.rs"
harness = false

[lints]
workspace = true
