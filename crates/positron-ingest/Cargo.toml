[package]
name = "positron-ingest"
description = "Positron native ingest and receiver adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
flate2 = { version = "=1.0.24", default-features = false, features = ["rust_backend"] }
opentelemetry-proto = { version = "=0.32.0", default-features = false, features = ["gen-tonic-messages", "logs", "with-serde"] }
positron-domain = { path = "../positron-domain" }
positron-governance = { path = "../positron-governance" }
positron-kernel = { path = "../positron-kernel" }
positron-policy = { path = "../positron-policy" }
positron-signals = { path = "../positron-signals" }
prost = "=0.14.3"
serde_json = "=1.0.149"
snap = "=1.1.1"

[dev-dependencies]
positron-runtime = { path = "../positron-runtime" }
