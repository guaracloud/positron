[profile.default]
fail-fast = false
failure-output = "immediate-final"
final-status-level = "slow"
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
status-level = "fail"
success-output = "never"

[profile.ci]
inherits = "default"
fail-fast = false
failure-output = "immediate-final"
final-status-level = "all"
retries = 0
status-level = "all"

[test-groups]
source-mutated-fixture-builds = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/^(quality_executes_and_binds_the_fixture_registry_bytes_captured_once|quality_rejects_a_fixture_root_symlink_race_without_touching_the_target|quality_keeps_writer_acknowledgement_bound_after_a_post_claim_case_swap|quality_rejects_a_symbolic_link_process_acknowledgement_after_claim|quality_rejects_an_oversized_process_acknowledgement_before_allocation|quality_keeps_integrity_mutations_bound_after_a_post_claim_case_swap|quality_kills_reaps_and_cleans_a_timed_out_fixture_writer|quality_fails_with_bounded_evidence_when_writer_reap_observation_stalls|quality_fails_when_attempt_owned_fixture_cleanup_fails|quality_rejects_an_ordinary_directory_replacing_the_cleaned_fixture_root|quality_rejects_a_removed_.*|quality_rejects_a_bypassed_.*_operation|quality_rejects_a_candidate_replacement_after_its_first_bounded_read|quality_atomically_retains_one_verdict_for_each_parallel_canonical_racer|quality_atomically_retains_one_verdict_for_each_parallel_collision_slot_racer|quality_never_replaces_a_concurrently_claimed_final_report_directory|quality_rejects_a_replaced_dependency_metadata_artifact_without_reading_the_forgery|quality_rejects_a_replaced_dependency_metadata_directory_without_touching_its_canary|quality_rejects_a_parent_sync_failure_after_creating_dependency_metadata_directory)$/)'
test-group = 'source-mutated-fixture-builds'
