# Generated from `crates/positron-config/src/contract.rs`.
# Protected references are intentionally omitted.

schema_version = 1

[diagnostics]
log_level = "info"

[listener]
control_path = "/var/run/positron/control.sock"
operations_bind_address = "127.0.0.1:13133"
operations_transport = "tls"
operations_accepted_socket_limit = 128
operations_per_address_accepted_socket_limit = 16
api_bind_address = "127.0.0.1:8080"
api_transport = "tls"
api_accepted_socket_limit = 128
api_per_address_accepted_socket_limit = 16
otlp_grpc_bind_address = "127.0.0.1:4317"
otlp_grpc_transport = "tls"
otlp_grpc_accepted_socket_limit = 128
otlp_grpc_per_address_accepted_socket_limit = 16
otlp_http_bind_address = "127.0.0.1:4318"
otlp_http_transport = "tls"
otlp_http_accepted_socket_limit = 128
otlp_http_per_address_accepted_socket_limit = 16
loki_push_bind_address = "127.0.0.1:3100"
loki_push_transport = "tls"
loki_push_accepted_socket_limit = 128
loki_push_per_address_accepted_socket_limit = 16

[listener.operations]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.api]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.otlp_grpc]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.otlp_http]
trusted_proxy_cidrs = []
forwarded_hops = 0

[listener.loki_push]
trusted_proxy_cidrs = []
forwarded_hops = 0

[runtime]
shutdown_grace_seconds = 30
max_registered_tenants = 2

[storage]
data_directory = "/var/lib/positron"
secrets_directory = "/var/lib/positron-secrets"
