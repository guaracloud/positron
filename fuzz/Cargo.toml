[package]
name = "positron-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
positron-kernel = { path = "../crates/positron-kernel" }
positron-domain = { path = "../crates/positron-domain" }

[[bin]]
name = "primary_data_volume_stateful"
path = "fuzz_targets/primary_data_volume_stateful.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encrypted_frame_open"
path = "fuzz_targets/encrypted_frame_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "local_root_key_file"
path = "fuzz_targets/local_root_key_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resource_governor_stateful"
path = "fuzz_targets/resource_governor_stateful.rs"
test = false
doc = false
bench = false

[[bin]]
name = "linux_capacity_parsers"
path = "fuzz_targets/linux_capacity_parsers.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
