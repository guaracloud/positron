// Canonical Positron public API definition. The committed Rust, HTTP/JSON,
// OpenAPI, schema, reference, and fixture artifacts change with this contract.
syntax = "proto3";

package positron.v1;

// Capability negotiation is the public foundation used before any later
// versioned service sends a request whose semantics the peer cannot support.
service CapabilityService {
  rpc Negotiate(CapabilityRequest) returns (CapabilityResponse);
}

// Authenticated System Administration API. Bearer credentials are transport
// metadata and are never included in request bodies. Tenant authority is
// selected only by the server's durable identity, never by a caller hint.
service ApiKeyService {
  rpc Manage(ApiKeyRequest) returns (ApiKeyResponse);
}

message ApiKeyRequest {
  KeyAction action = 1;
  optional KeyScope scope = 2;
  optional string principal = 3;
  optional uint64 expires_at_unix_seconds = 4;
  optional uint64 expected_generation = 5;
  optional string idempotency_key = 6;
}
enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_CREATE = 1;
  KEY_ACTION_LIST = 2;
  KEY_ACTION_ROTATE = 3;
  KEY_ACTION_REVOKE = 4;
  KEY_ACTION_SCOPE_INSPECT = 5;
}
enum KeyScope {
  KEY_SCOPE_UNSPECIFIED = 0;
  KEY_SCOPE_INGEST = 1;
  KEY_SCOPE_QUERY = 2;
  KEY_SCOPE_TENANT_ADMINISTRATION = 3;
  KEY_SCOPE_SYSTEM_ADMINISTRATION = 4;
}
message KeyDescriptor {
  string principal = 1;
  KeyScope scope = 2;
  bool active = 3;
  optional uint64 expires_at_unix_seconds = 4;
  uint64 generation = 5;
}
message ApiKeyResponse {
  repeated KeyDescriptor keys = 1;
  optional string principal = 2;
  // Present only in the first successful create/rotate response. Idempotent
  // retries resolve the principal but never reconstruct or redisplay a secret.
  optional string secret = 3;
}

message CapabilityRequest {
  uint32 api_major = 1;
  Capability capability = 2;
}

message CapabilityResponse {
  uint32 api_major = 1;
  string schema_digest = 2;
  CapabilityAvailability availability = 3;
  PublicError refusal = 4;
  DeprecationState deprecation = 5;
  Capability capability = 6;
}

// Unspecified preserves additive compatibility with older v1 clients, whose
// negotiation request means the canonical public interface itself.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_CANONICAL_PUBLIC_INTERFACE = 1;
  CAPABILITY_RELEASE_ONE_QUERY = 2;
  CAPABILITY_METRICS = 3;
}

enum CapabilityAvailability {
  CAPABILITY_AVAILABILITY_UNSPECIFIED = 0;
  CAPABILITY_AVAILABILITY_IMPLEMENTED = 1;
  CAPABILITY_AVAILABILITY_UNAVAILABLE = 2;
  CAPABILITY_AVAILABILITY_UNSUPPORTED = 3;
  CAPABILITY_AVAILABILITY_VERSION_INCOMPATIBLE = 4;
}

enum RetryClass {
  RETRY_CLASS_UNSPECIFIED = 0;
  RETRY_CLASS_NEVER = 1;
  RETRY_CLASS_AFTER_BACKOFF = 2;
  RETRY_CLASS_AFTER_INPUT_CORRECTION = 3;
}

enum CompletionState {
  COMPLETION_STATE_UNSPECIFIED = 0;
  COMPLETION_STATE_REJECTED = 1;
}

enum DeprecationState {
  DEPRECATION_STATE_UNSPECIFIED = 0;
  DEPRECATION_STATE_CURRENT = 1;
  DEPRECATION_STATE_DEPRECATED = 2;
}

message PublicError {
  PublicErrorCode code = 1;
  RetryClass retry_class = 2;
  CompletionState completion_state = 3;
  FailureSource source = 4;
  SafeDetail safe_detail = 5;
}

enum PublicErrorCode {
  PUBLIC_ERROR_CODE_UNSPECIFIED = 0;
  PUBLIC_ERROR_CODE_UNSUPPORTED_API_VERSION = 1;
  PUBLIC_ERROR_CODE_CAPABILITY_UNAVAILABLE = 2;
  PUBLIC_ERROR_CODE_CAPABILITY_UNSUPPORTED = 3;
  PUBLIC_ERROR_CODE_MALFORMED_REQUEST = 4;
  PUBLIC_ERROR_CODE_REQUEST_TOO_LARGE = 5;
  PUBLIC_ERROR_CODE_UNKNOWN_FIELD = 6;
}

enum FailureSource {
  FAILURE_SOURCE_UNSPECIFIED = 0;
  FAILURE_SOURCE_CAPABILITY_NEGOTIATION = 1;
  FAILURE_SOURCE_GRPC_DECODE = 2;
  FAILURE_SOURCE_HTTP_DECODE = 3;
}

enum SafeDetail {
  SAFE_DETAIL_UNSPECIFIED = 0;
  SAFE_DETAIL_API_MAJOR_UNSUPPORTED = 1;
  SAFE_DETAIL_CAPABILITY_NOT_AVAILABLE = 2;
  SAFE_DETAIL_CAPABILITY_NOT_SUPPORTED = 3;
  SAFE_DETAIL_REQUEST_MALFORMED = 4;
  SAFE_DETAIL_REQUEST_LIMIT_EXCEEDED = 5;
  SAFE_DETAIL_FIELD_NOT_RECOGNIZED = 6;
}
