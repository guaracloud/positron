[graph]
all-features = true
exclude-dev = false
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
ignore = []
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
]
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
  { name = "sha2", version = "<0.10.9" },
  { name = "sha2", version = ">0.10.9" },
  { name = "toml", version = "<1.1.4" },
  { name = "toml", version = ">1.1.4" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
